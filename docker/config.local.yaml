server:
  bind: "0.0.0.0:8080"

cache:
  data_dir: "/data"
  media_ttl_minutes: 360
  media_max_megabytes: 10240
  disconnect_behavior: "delay_cancel"
  disconnect_grace_seconds: 15

metadata:
  refresh_interval_hours: 24
  refresh_recent_grace_minutes: 60

downloads:
  max_concurrent: 3

# Docker uses this for the pip-managed /opt/yt-dlp install. The image also sets
# YT_DLP_FEED_PIP_TOOL_UPDATES_ENABLED=true so container runs stay enabled even
# if a mounted config omits this section.
pip_tool_updates:
  enabled: true
  startup_check: true
  interval_hours: 168
  pip_package: "yt-dlp"

auth:
  enabled: false

users:
  - name: "derek"
    services:
      - kind: "soundcloud"
        account: "dereknet"
        profile_url: "https://soundcloud.com/dereknet"
        feeds:
          - profile
          - likes
      - kind: "soundcloud"
        account: "NTS"
        profile_url: "https://soundcloud.com/user-202286394-991268468"
        feeds:
          - profile
          - likes
