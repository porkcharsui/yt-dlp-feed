server:
  bind: "0.0.0.0:8080"

cache:
  data_dir: "./data"
  media_ttl_minutes: 360
  media_max_megabytes: 10240
  disconnect_behavior: "delay_cancel"
  disconnect_grace_seconds: 15

metadata:
  refresh_interval_hours: 24
  refresh_recent_grace_minutes: 60

downloads:
  max_concurrent: 3

auth:
  enabled: false

users:
  - name: "derek"
    services:
      - kind: "soundcloud"
        name: "dereknet"
        profile_url: "https://soundcloud.com/dereknet"
        feeds:
          - profile
          - likes
      - kind: "soundcloud"
        name: "NTS"
        profile_url: "https://soundcloud.com/user-202286394-991268468"
        feeds:
          - profile
      - kind: "soundcloud"
        name: "Four Tet"
        profile_url: "https://soundcloud.com/four-tet"
        feeds:
          - profile
      - kind: "soundcloud"
        name: "Caribou"
        profile_url: "https://soundcloud.com/caribouband"
        feeds:
          - profile
